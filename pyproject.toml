[project]
name = "toy-money"
version = "0.1.0"
description = "Hypothesis-testing macro comparison tool (Phase 1: China now vs Japan 1990s)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
toy-money = "toy_money.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toy_money"]

[tool.pytest.ini_options]
testpaths = ["tests"]
