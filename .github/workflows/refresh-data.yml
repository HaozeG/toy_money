name: refresh-data

# Fetches macro series from the official providers on GitHub's runners, which are
# not behind the network policy that blocks api.worldbank.org / www.imf.org /
# stats.bis.org from the dev machine. Publishes the parquet cache as a workflow
# artifact; pull it locally with `uv run toy-money pull-cache`.
#
# This run is the live integration test for sources/*.py: it fetches every
# provider-backed series, exercises BIS dimension validation against the live
# SDMX CSV, and then runs tests/test_live_vs_seed.py to catch a key that parsed
# but selected the wrong series. Adding a new BIS flow still needs a human check
# (`toy-money verify`).

on:
  workflow_dispatch:
  schedule:
    # Monthly — the series are annual/quarterly, nothing changes faster.
    - cron: "17 6 1 * *"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync --extra dev

      - name: Fetch (non-fatal; we publish whatever came back)
        id: fetch
        run: |
          set +e
          set -o pipefail
          uv run toy-money fetch --force 2>&1 | tee fetch.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Live vs seed (wrong-key signal, not a network signal)
        id: livecheck
        if: always()
        run: |
          set +e
          uv run pytest tests/test_live_vs_seed.py -q 2>&1 | tee livecheck.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise provenance
        if: always()
        run: |
          {
            echo '## Data refresh result'
            echo
            echo "fetch exit code: \`${{ steps.fetch.outputs.exit_code }}\` (non-zero = at least one source degraded to seed)"
            echo "live-vs-seed exit code: \`${{ steps.livecheck.outputs.exit_code }}\` (non-zero = a live series disagrees with the hand-checked seed — likely wrong BIS key)"
            echo
            echo '```'
            cat fetch.log
            echo
            cat livecheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-cache
          path: |
            data/*.parquet
            data/*.meta.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail the run if any source degraded
        if: steps.fetch.outputs.exit_code != '0'
        run: |
          echo "::warning::At least one source fell back to seed data — cache published, but incomplete. Check the job summary."
          exit 1

      - name: Fail the run if live disagrees with seed
        if: steps.livecheck.outputs.exit_code != '0'
        run: |
          echo "::warning::A live series disagrees with the hand-checked seed — a BIS key may have selected the wrong series. Check the job summary."
          exit 1
