name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync deps
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Materialise bundled fallback data
        run: uv run toy-money fetch --source seed --force

      - name: Smoke-build the report
        run: uv run toy-money build --out /tmp/china_japan.html
